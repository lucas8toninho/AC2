<h2>Cadastrar Inscricao</h2>

<form (ngSubmit)="cadastrar()">
    <label>
        Nome:
        <input type="text" name="nome" [(ngModel)]="nome" placeholder="Digite seu nome" />
    </label>
    <label>
        <input type="email" name="email" [(ngModel)]="email" placeholder="Digite seu email">
    </label>

    <button type="submit">Cadastrar</button>
</form>

<a routerLink="/lista">Ver inscricoes</a>
